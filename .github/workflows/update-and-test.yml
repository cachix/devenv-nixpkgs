name: Update and test

on:
  push:
    branches: [main]
    paths:
      - patches/**
      - flake.nix
      - lib/source.nix
      - lib/patch-hash.nix
      - lib/publish_sources.py
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "When to run the test suite (auto = only when nixpkgs updated)"
        type: choice
        default: auto
        options:
          - auto
          - always
          - never

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, Linux]
    outputs:
      nixpkgs-rev: ${{ steps.nixpkgs.outputs.short }}
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        if: github.event_name != 'push'
        run: nix flake update

      - name: Get nixpkgs revision
        id: nixpkgs
        run: |
          REV=$(nix flake metadata --json | jq -r '.locks.nodes["nixpkgs-src"].locked.rev')
          SHORT=$(echo "$REV" | cut -c1-7)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Nixpkgs revision: $SHORT"

      - name: Publish patched source snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          python3 lib/publish_sources.py --publish

      - name: Evaluate Darwin without import-from-derivation
        run: |
          nix eval --raw .#legacyPackages.aarch64-darwin.hello.drvPath \
            --option allow-import-from-derivation false \
            --option builders "" --option max-jobs 0 --option substitute false

      - name: Commit and push
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update nixpkgs to ${{ steps.nixpkgs.outputs.short }}"
          file_pattern: flake.lock sources.json

  test:
    needs: update
    # auto (and scheduled runs): test when the lock or source snapshots changed.
    # always: always test. never: never test.
    if: >-
      github.event_name == 'push' || inputs.run_tests == 'always' ||
      (inputs.run_tests != 'never' && needs.update.outputs.changes_detected == 'true')
    uses: ./.github/workflows/run-devenv-tests.yml
    with:
      nixpkgs-input: "github:cachix/devenv-nixpkgs/main"
    secrets: inherit
